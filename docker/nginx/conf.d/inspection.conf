# S20 阶段网关配置（六组件环境验收用）
# 完整版（上游双实例负载均衡/限流/安全头/静态托管）见设计报告 5.2.6，S21 启用 /api/ 上游

server {
    listen 80;
    server_name _;
    server_tokens off;

    # 网关存活页：用于 S20 验收（curl :8080 应返回此文本）
    location = / {
        default_type text/plain;
        return 200 'inspection-platform gateway: OK\n';
    }

    # Kibana 反代（不直接暴露 5601）
    # 注意：Kibana 容器已设 SERVER_BASEPATH=/kibana，proxy_pass 不能带尾斜杠，
    # 否则前缀被剥掉后 Kibana 404（S20 排错实录，见 STATE 风险 #14）
    location /kibana/ {
        proxy_pass http://kibana:5601;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }

    # /api/ 上游在 S21（后端双实例就绪）时启用，配置全文见设计报告 5.2.6
}
