# 网关配置（S21 起启用后端上游；Kibana 反代见 S20 记录）
# 完整设计见设计报告 5.2.6

# ---- 限流区（FR-5.4，S50 测试暴露缺口后补齐） ----
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
limit_req_status 503;

# ---- 上游：后端双实例，最少连接策略（FR-5.2，设计报告 4.4.6） ----
upstream inspection_backend {
    least_conn;
    server backend-1:8081 max_fails=2 fail_timeout=10s;
    server backend-2:8082 max_fails=2 fail_timeout=10s;
    keepalive 32;                      # 与后端保持长连接，降低建连开销
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    # ---- 前端 SPA 静态托管（S40 起；History 路由回退，FR-5.6） ----
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # ---- 后端 API：反向代理 + 负载均衡（FR-5.1、FR-5.2、FR-5.4 限流） ----
    location /api/ {
        limit_req zone=api_limit burst=40 nodelay;   # 20r/s + 突发 40（FR-5.4；S50 PT006 验证）
        proxy_pass http://inspection_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";                   # 配合 keepalive 复用长连接
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 3s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
        proxy_next_upstream error timeout http_502 http_503;   # 故障自动切换（FR-5.3）
    }

    # ---- 维护接口：长耗时操作（S64 证据图批量重生成，分钟级），放宽读超时且不限流 ----
    location /api/maintenance/ {
        proxy_pass http://inspection_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_send_timeout    60s;
        proxy_read_timeout    900s;   # S64：批量重生成数分钟级（风险 #39）
    }

    # Kibana 反代（不直接暴露 5601）
    # 注意：Kibana 容器已设 SERVER_BASEPATH=/kibana，proxy_pass 不能带尾斜杠，
    # 否则前缀被剥掉后 Kibana 404（S20 排错实录，见 STATE 风险 #14）
    location /kibana/ {
        proxy_pass http://kibana:5601;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }
}
