# 网关配置（S21 起启用后端上游；Kibana 反代见 S20 记录）
# 完整设计见设计报告 5.2.6（限流/安全头等将在 S40 前端接入时补齐）

# ---- 上游：后端双实例，最少连接策略（FR-5.2，设计报告 4.4.6） ----
upstream inspection_backend {
    least_conn;
    server backend-1:8081 max_fails=2 fail_timeout=10s;
    server backend-2:8082 max_fails=2 fail_timeout=10s;
    keepalive 32;                      # 与后端保持长连接，降低建连开销
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    # ---- 前端 SPA 静态托管（S40 起；History 路由回退，FR-5.6） ----
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # ---- 后端 API：反向代理 + 负载均衡（FR-5.1、FR-5.2） ----
    location /api/ {
        proxy_pass http://inspection_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";                   # 配合 keepalive 复用长连接
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 3s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
        proxy_next_upstream error timeout http_502 http_503;   # 故障自动切换（FR-5.3）
    }

    # Kibana 反代（不直接暴露 5601）
    # 注意：Kibana 容器已设 SERVER_BASEPATH=/kibana，proxy_pass 不能带尾斜杠，
    # 否则前缀被剥掉后 Kibana 404（S20 排错实录，见 STATE 风险 #14）
    location /kibana/ {
        proxy_pass http://kibana:5601;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }
}
