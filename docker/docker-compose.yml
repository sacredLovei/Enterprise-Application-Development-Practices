# 无人机-机器狗空地协同巡检集成平台 —— 六组件 Docker 编排
# 依据：设计报告 4.6 节（部署拓扑/端口表/关键决策）；镜像版本与 STATE 注册表一致
name: inspection-platform

networks:
  inspection-net:
    driver: bridge

volumes:
  hdfs-name:
  hdfs-data:
  mongo-data:
  kafka-data:
  es-data:
  kibana-data:

services:
  # ============ 分布式文件系统 Hadoop HDFS ============
  namenode:
    image: apache/hadoop:3.3.6
    container_name: namenode
    hostname: namenode
    ports:
      - "9870:9870"                    # Web UI（仅运维查看）
    environment:
      # 镜像内置格式化守卫：/data/name 存在则跳过 format（设计报告 4.6.3(2)，防 P-2）
      ENSURE_NAMENODE_DIR: /data/name
      # 注：不启用 CORE_CONF_*/HDFS_CONF_* 环境变量（envtoconf 的 conf 格式存在解析 bug，
      #     to_conf 对字典迭代解包崩溃，见 STATE 风险 #13）；配置一律走挂载文件
    volumes:
      - hdfs-name:/data
      - ./hadoop/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./hadoop/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
    command: ["hdfs", "namenode"]
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/9870"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks: [inspection-net]

  datanode:
    image: apache/hadoop:3.3.6
    container_name: datanode
    hostname: datanode
    depends_on:
      namenode:
        condition: service_healthy
    ports:
      - "9864:9864"                    # 仅运维查看
    environment:
      # 镜像内置等待机制：等 NameNode 端口就绪再启动（starter.sh WAITFOR）
      WAITFOR: namenode:9870
      WAITFOR_TIMEOUT: "240"
      # 同 namenode：配置走挂载文件，不启用 envtoconf（风险 #13）
    volumes:
      - hdfs-data:/data
      - ./hadoop/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./hadoop/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
    command: ["hdfs", "datanode"]
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/9864"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks: [inspection-net]

  # ============ 分布式数据库 MongoDB（单节点副本集 rs0） ============
  mongodb:
    image: mongo:6.0
    container_name: mongodb
    hostname: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 15s
    networks: [inspection-net]

  # ============ 消息中间件 Kafka（官方镜像 apache/kafka:4.0.0，纯 KRaft 单节点，双监听器） ============
  # 内部 PLAINTEXT://kafka:9092 供容器应用；外部 EXTERNAL://localhost:9094 供本机 IDE 调试
  # 双监听器设计依据：设计报告 4.6.3(1)，规避 advertised.listeners 地址回传问题
  # 镜像更换依据：Bitnami 已下架全部公开 Kafka 镜像（D-18）
  kafka:
    image: apache/kafka:4.0.0
    container_name: kafka
    hostname: kafka
    ports:
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"    # 主题必须显式创建（口径可控）
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1" # 单节点副本因子
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms512m -Xmx1g            # 内存受限（D-14），堆上限 1GB
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 60s
    networks: [inspection-net]

  # ============ 检索引擎 Elasticsearch（单节点，安全关闭，堆 1GB） ============
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    container_name: elasticsearch
    hostname: elasticsearch
    ports:
      - "9200:9200"                    # 仅运维查看
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"  # 仿真环境关闭安全认证（设计报告 4.6.3）
      ES_JAVA_OPTS: -Xms1g -Xmx1g      # 内存受限（D-14），堆固定 1GB
      bootstrap.memory_lock: "false"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 30
      start_period: 60s
    networks: [inspection-net]

  # ============ 可视化 Kibana（经 Nginx /kibana/ 访问） ============
  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.0
    container_name: kibana
    hostname: kibana
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      SERVER_BASEPATH: /kibana
      SERVER_REWRITEBASEPATH: "true"
    depends_on:
      elasticsearch:
        condition: service_healthy
    volumes:
      - kibana-data:/usr/share/kibana/data
    healthcheck:
      # basePath=/kibana 时状态接口位于 /kibana/api/status（S20 排错实录，见 STATE 风险 #14）
      test: ["CMD-SHELL", "curl -fs http://localhost:5601/kibana/api/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 30
      start_period: 90s
    networks: [inspection-net]

  # ============ 业务服务后端（无状态双实例，演示负载均衡） ============
  backend-1:
    image: inspection-backend:0.2
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: backend-1
    hostname: backend-1
    environment:
      SERVER_PORT: "8081"
      APP_INSTANCE_ID: backend-1
      MONGODB_URI: mongodb://mongodb:27017/inspection
      KAFKA_SERVERS: kafka:9092
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/actuator/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 40s
    networks: [inspection-net]

  backend-2:
    image: inspection-backend:0.2
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: backend-2
    hostname: backend-2
    environment:
      SERVER_PORT: "8082"
      APP_INSTANCE_ID: backend-2
      MONGODB_URI: mongodb://mongodb:27017/inspection
      KAFKA_SERVERS: kafka:9092
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8082/actuator/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 40s
    networks: [inspection-net]

  # ============ 设备仿真（2 无人机 + 2 机器狗，S31） ============
  # 宿主机端口为故障注入运维通道（POST /sim/fault），业务入口仍只有 Nginx 8080
  uav-sim-1:
    image: inspection-simulator:0.7
    build:
      context: ../simulator
      dockerfile: Dockerfile
    container_name: uav-sim-1
    hostname: uav-sim-1
    ports:
      - "8089:8080"
    environment:
      SIM_DEVICE_ID: UAV-001
      SIM_DEVICE_TYPE: UAV
      SIM_CONSUMER_GROUP: sim-uav
      SIM_COMMAND_GROUP: sim-cmd-UAV-001
      KAFKA_SERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    networks: [inspection-net]

  uav-sim-2:
    image: inspection-simulator:0.7
    build:
      context: ../simulator
      dockerfile: Dockerfile
    container_name: uav-sim-2
    hostname: uav-sim-2
    ports:
      - "8090:8080"
    environment:
      SIM_DEVICE_ID: UAV-002
      SIM_DEVICE_TYPE: UAV
      SIM_CONSUMER_GROUP: sim-uav
      SIM_COMMAND_GROUP: sim-cmd-UAV-002
      KAFKA_SERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    networks: [inspection-net]

  dog-sim-1:
    image: inspection-simulator:0.7
    build:
      context: ../simulator
      dockerfile: Dockerfile
    container_name: dog-sim-1
    hostname: dog-sim-1
    ports:
      - "8091:8080"
    environment:
      SIM_DEVICE_ID: ROBOT-001
      SIM_DEVICE_TYPE: ROBOT_DOG
      SIM_CONSUMER_GROUP: sim-robot
      SIM_COMMAND_GROUP: sim-cmd-ROBOT-001
      KAFKA_SERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    networks: [inspection-net]

  dog-sim-2:
    image: inspection-simulator:0.7
    build:
      context: ../simulator
      dockerfile: Dockerfile
    container_name: dog-sim-2
    hostname: dog-sim-2
    ports:
      - "8092:8080"
    environment:
      SIM_DEVICE_ID: ROBOT-002
      SIM_DEVICE_TYPE: ROBOT_DOG
      SIM_CONSUMER_GROUP: sim-robot
      SIM_COMMAND_GROUP: sim-cmd-ROBOT-002
      KAFKA_SERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    networks: [inspection-net]

  # ============ 网关 Nginx（唯一对外入口 :8080） ============
  nginx:
    image: nginx:1.25-alpine
    container_name: nginx
    hostname: nginx
    ports:
      - "8080:80"                      # 唯一业务入口（设计报告 4.6.2 端口表）
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ../web/dist:/usr/share/nginx/html:ro     # S40 前端构建产物（先 npm run build 再起服务）
    depends_on:
      kibana:
        condition: service_healthy
      backend-1:
        condition: service_healthy
      backend-2:
        condition: service_healthy
    healthcheck:
      # busybox wget 连 localhost 先解析 ::1，而 nginx 仅监听 IPv4 且 busybox 不回退 → 必须用 127.0.0.1（风险 #15）
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
    networks: [inspection-net]
