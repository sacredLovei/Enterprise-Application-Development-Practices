server:
  port: ${SERVER_PORT:8081}
  # 业务异常信息透出给前端（如"设备离线"提示；课程仿真环境可接受）
  error:
    include-message: always

app:
  instance-id: ${APP_INSTANCE_ID:backend-1}
  # S88 简单权限认证（课程任务项 1）：演示账号 + HMAC 签名令牌
  # 注意：双实例（backend-1/backend-2）必须使用同一 secret，否则跨实例校验失败（负载均衡下必现）
  auth:
    secret: ${AUTH_SECRET:inspection-course-demo-secret-2026}
    ttl-hours: ${AUTH_TTL_HOURS:12}
    users:
      - username: admin
        password: ${AUTH_ADMIN_PASSWORD:admin123}
        display-name: 系统管理员
        role: ADMIN
      - username: operator
        password: ${AUTH_OPERATOR_PASSWORD:operator123}
        display-name: 巡检值班员
        role: OPERATOR

# S105 任务悬挂对账（TaskReconcileService）：重启后遗留的 DISPATCHED/RUNNING 任务清算
task:
  # 启动对账宽限期（秒）：启动前该时长内派发的任务不动（防误杀刚下发的任务）
  reconcile-grace-seconds: ${TASK_RECONCILE_GRACE_SECONDS:60}
  # 超时兜底阈值（分钟）：执行超过该时长仍未终结的任务自动置 FAILED
  stale-minutes: ${TASK_STALE_MINUTES:30}

spring:
  application:
    name: inspection-backend
  data:
    mongodb:
      # 容器内默认 mongodb:27017；本机 IDE 调试时用 MONGODB_URI 覆盖为 localhost:27017
      uri: ${MONGODB_URI:mongodb://mongodb:27017/inspection}
      # S50 定位：此前未开启自动建索引，@Indexed(TTL) 与复合索引均未落地（PT004 实测劣化根因）
      auto-index-creation: true
  elasticsearch:
    # 容器内默认 elasticsearch:9200（安全已关闭）
    uris: ${ES_URIS:http://elasticsearch:9200}
    connection-timeout: 3s
    socket-timeout: 30s
  kafka:
    # 容器内默认 kafka:9092（内部监听器）；本机 IDE 调试时用 localhost:9094（外部监听器，D-6）
    bootstrap-servers: ${KAFKA_SERVERS:kafka:9092}
    consumer:
      group-id: biz-storage-consumer
      auto-offset-reset: earliest
      enable-auto-commit: false          # 关闭自动提交：业务成功才提交（5.2.2）
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
    listener:
      ack-mode: manual_immediate
      concurrency: 3

management:
  endpoints:
    web:
      exposure:
        include: health
